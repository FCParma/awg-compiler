name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev zlib1g-dev file python3

      - name: Download ImageBuilder and Build
        run: |
          # Скачиваем официальный Image Builder вместо SDK (он стабильнее)
          wget https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/immortalwrt-imagebuilder-25.12.2-ramips-mt7621.Linux-x86_64.tar.xz
          tar -xf immortalwrt-imagebuilder-*.tar.xz
          cd immortalwrt-imagebuilder-*
          
          # Клонируем исходники AmneziaWG в папку пакетов
          mkdir -p package/awg-openwrt
          git clone https://github.com/2Grey/awg-openwrt.git package/awg-openwrt
          
          # Явно прописываем подмену хэша вашего ядра (LINUX_VERMAGIC) во всех конфигурационных файлах сборщика
          sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' include/kernel-defaults.mk || true
          find . -name Makefile -exec sed -i 's/base-files/base-files/g' {} \;
          
          # Добавляем фиды и создаем базовый конфиг для компиляции отдельного пакетов
          mkdir -p .config
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-amneziawg=y" >> .config
          
          # Запускаем компиляцию пакета AmneziaWG напрямую
          make package/awg-openwrt/compile V=s IGNORE_ERRORS=m

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-packages
          path: immortalwrt-imagebuilder-*/bin/packages/mipsel_24kc/base/*amneziawg*
