name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev msgfmt zlib1g-dev file python3

      - name: Download SDK and Build
        run: |
          # Скачиваем официальный SDK для вашей архитектуры mt7621
          wget https://mirrors.vsean.net/openwrt/releases/25.12.2/targets/ramips/mt7621/immortalwrt-sdk-25.12.2-ramips-mt7621_gcc-14.2.0_musl.Linux-x86_64.tar.xz
          tar -xf immortalwrt-sdk-*.tar.xz
          cd immortalwrt-sdk-*
          
          # Клонируем исходники AmneziaWG
          git clone https://github.com/2Grey/awg-openwrt.git package/awg-openwrt
          
          # Обновляем конфигурацию пакетов
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Жестко прописываем ВАШ хэш ядра в конфигурацию сборщика
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-amneziawg=y" >> .config
          
          # Подменяем хэш ядра в метаданных SDK на ваш личный
          sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' include/kernel-defaults.mk
          
          # Запускаем компиляцию только модуля AmneziaWG
          make defconfig
          make package/awg-openwrt/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-packages
          path: immortalwrt-sdk-*/bin/packages/mipsel_24kc/base/*amneziawg*
