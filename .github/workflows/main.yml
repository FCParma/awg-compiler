name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bzip2 gawk gettext git libncurses5-dev libssl-dev patch unzip zlib1g-dev file python3

      - name: Download ImageBuilder and Compile AWG
        run: |
          # 1. Скачиваем официальный готовый Image Builder для вашего роутера
          wget https://downloads.immortalwrt.org/releases/25.12.2/targets/ramips/mt7621/immortalwrt-imagebuilder-25.12.2-ramips-mt7621.Linux-x86_64.tar.xz
          tar -xf immortalwrt-imagebuilder-*.tar.xz
          cd immortalwrt-imagebuilder-*
          
          # 2. Прописываем Амнезию как фид пакетов
          echo "src-git awg_feed https://github.com/2Grey/awg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update awg_feed
          ./scripts/feeds install -a -p awg_feed
          
          # 3. Подменяем хэш ядра в метаданных на ваш личный, чтобы пакет встал как родной
          sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' include/kernel-defaults.mk || true
          find . -name Makefile -exec sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' {} \; || true
          
          # 4. Запускаем моментальную компиляцию СТРОГО пакетов Амнезии
          make package/feeds/awg_feed/amneziawg-tools/compile V=s
          make package/feeds/awg_feed/kmod-amneziawg/compile V=s
          make package/feeds/awg_feed/luci-proto-amneziawg/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-packages
          path: immortalwrt-imagebuilder-*/bin/packages/mipsel_24kc/awg_feed/*
