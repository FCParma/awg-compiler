name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev zlib1g-dev file python3

      - name: Clone and Inject Vermagic
        run: |
          # 1. Скачиваем чистые исходники ImmortalWrt стабильной ветки 25.12
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          
          # 2. Создаем папку загрузок dl и принудительно подкладываем РАБОЧИЙ архив Lua из зеркала
          mkdir -p dl
          wget -O dl/lua-5.1.5.tar.gz https://sources.openwrt.org/lua-5.1.5.tar.gz
          
          # 3. Прописываем Амнезию как официальный фид пакетов
          echo "src-git awg_feed https://github.com/2Grey/awg-openwrt.git" >> feeds.conf.default
          ./scripts/feeds update awg_feed
          ./scripts/feeds install -a -p awg_feed
          
          # 4. Настраиваем архитектуру вашего Xiaomi Mi Router 3G
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          make defconfig
          
          # 5. ИНЪЕКЦИЯ ХЭША: прописываем ваш уникальный хэш ядра в конфигурацию сборщика
          find . -name Makefile -exec sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' {} \; || true
          sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' include/kernel-defaults.mk || true
          
          # 6. СБОРКА ИНСТРУМЕНТА СЖАТИЯ (ИСПРАВЛЕНО: собираем только то, чего не хватало)
          make tools/libdeflate/compile V=s
          
          # 7. Запускаем точечную компиляцию модуля ядра Амнезии
          make package/feeds/awg_feed/kmod-amneziawg/compile V=s IGNORE_ERRORS=m

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-packages
          path: immortalwrt/bin/packages/mipsel_24kc/awg_feed/*amneziawg*
