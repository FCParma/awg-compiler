name: Build AmneziaWG for ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev zlib1g-dev file python3

      - name: Clone OpenWrt and Package
        run: |
          # Скачиваем чистые исходники ImmortalWrt (ЗАМЕНИТЕ BBB НА ХТТПС://ГИТХАБ.КОМ)
          git clone --depth 1 -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          
          # Скачиваем Амнезию СРАЗУ в локальные пакеты (ЗАМЕНИТЕ BBB НА ХТТПС://ГИТХАБ.КОМ)
          git clone https://github.com/2Grey/awg-openwrt.git package/awg-openwrt
          
          # Обновляем и устанавливаем фиды (теперь сборщик точно проиндексирует Амнезию)
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Выбираем архитектуру вашего Xiaomi Mi Router 3G
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-3g=y" >> .config
          
          # Включаем компиляцию пакетов AmneziaWG
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          
          # Подменяем хэш ядра в метаданных сборщика на ваш личный
          sed -i 's/LINUX_VERMAGIC:=.*/LINUX_VERMAGIC:=6a2bf6a139096c2bbdc3e52f4b809523/g' include/kernel-defaults.mk
          
          # Запускаем компиляцию пакета AmneziaWG
          make defconfig
          make package/awg-openwrt/compile V=s IGNORE_ERRORS=m

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-packages
          path: immortalwrt/bin/packages/mipsel_24kc/base/*amneziawg*
